# ===================================================
# Conexao com o banco de dados MySQL (ambiente LOCAL)
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/loginapidb
spring.datasource.username=root
spring.datasource.password=

# Driver JDBC responsavel por traduzir os comandos Java em comandos MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# Configuracoes do JPA / Hibernate
# ===================================================

# ddl-auto=update -> o Hibernate cria/altera tabelas automaticamente
# com base nas entidades (@Entity). USO TEMPORARIO so em dev.
# Vamos substituir por Flyway (migrations) mais pra frente no projeto.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console cada comando SQL que o Hibernate esta executando.
# Util para aprender/depurar; normalmente desligado (false) em producao.
spring.jpa.show-sql=true